name: BRM Prices - Marketo Email Update

on:
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Skip the "all prices are today" gate and publish immediately'
        type: boolean
        default: false
      skip_schedule:
        description: 'Push + approve draft but do not schedule the smart campaigns (no send)'
        type: boolean
        default: false
  repository_dispatch:
    types: [run-brm-email]

jobs:
  update-email:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv pandas openpyxl

      - name: Run email update script
        env:
          FASTMARKETS_SERVICE_NAME: ${{ secrets.FASTMARKETS_SERVICE_NAME }}
          FASTMARKETS_SERVICE_KEY: ${{ secrets.FASTMARKETS_SERVICE_KEY }}
          MARKETO_BASE_URL: ${{ secrets.MARKETO_BASE_URL }}
          MARKETO_CLIENT_ID: ${{ secrets.MARKETO_CLIENT_ID }}
          MARKETO_CLIENT_SECRET: ${{ secrets.MARKETO_CLIENT_SECRET }}
          MARKETO_EMAIL_ID: ${{ secrets.MARKETO_EMAIL_ID_BRM }}
          MARKETO_EMAIL_ID2: ${{ secrets.MARKETO_EMAIL_ID2_BRM }}
          MARKETO_SC_IDS: ${{ secrets.MARKETO_SC_IDS_BRM }}
          FORCE_PUBLISH: ${{ inputs.force_publish && '1' || '0' }}
          SKIP_SCHEDULE: ${{ inputs.skip_schedule && '1' || '0' }}
        run: python brmpriceupdate.py